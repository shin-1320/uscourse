<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0300b2">

<!-- ═══════════════════════════════════════════════════
     홈 화면에 추가 (PWA)

     웹은 주소를 기억해야 다시 올 수 있다는 약점이 있다.
     홈 화면에 아이콘을 두면 앱처럼 한 번에 열리고,
     재방문이 잦은 일본 여행자 같은 경우에 특히 중요하다.

     iPhone : 사파리 → 공유 → "홈 화면에 추가"
     Android: 크롬 → ⋮ → "홈 화면에 추가"
     ═══════════════════════════════════════════════════ -->
<link rel="manifest" href="site.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Near me">
<meta name="mobile-web-app-capable" content="yes">
<title>Near me · Busan</title>

<!--
  ═══════════════════════════════════════════════════════
  Near me — 지금 내 주변 (부산 전역)

  가게 앞에 서서 몇 초 안에 "들어갈지"를 정하는 화면입니다.
  · 위치를 허용하면 가까운 순으로 정렬됩니다.
  · 이름·주소·지역 어느 것으로도 검색됩니다.
  · 목록과 지도를 전환할 수 있습니다.
  · 4개 언어를 지원합니다 (EN · 日本語 · 中文繁 · 中文简).
  · 확인되지 않은 항목은 숨기지 않고 밝힙니다.
  ═══════════════════════════════════════════════════════
-->

<!-- ═══════════════════════════════════════════════════
     Google Analytics
     여기서 재는 것은 "왔다"가 아니라 "움직였다" 입니다.
     특히 map_click(네이버 지도로 나감)이 실제로 가겠다는 신호이므로
     가장 중요한 지표입니다.
     ═══════════════════════════════════════════════════ -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-X4ETPQHLXG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-X4ETPQHLXG');

  /* 모든 이벤트에 기기·언어를 함께 보낸다.
     모바일에서만 쓰이는지, 어느 언어권이 오는지 나눠 보기 위함이다. */
  function track(name, params){
    const w = window.innerWidth || 0;
    const common = {
      device_type: w < 640 ? 'mobile' : (w < 1024 ? 'tablet' : 'desktop'),
      language: (window.LANG || document.documentElement.lang || 'en'),
    };
    const merged = Object.assign(common, params || {});
    if (window.NM_DEBUG) console.log('[track]', name, merged);
    try { gtag('event', name, merged); } catch(e){}
  }

  // 로컬에서 열면 콘솔에 찍어 확인할 수 있게 한다
  window.NM_DEBUG = (location.protocol === 'file:' || location.hostname === 'localhost');

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --brand:#0300b2;
    --ink:#0b0d14; --text:#31364a; --muted:#6b7185; --faint:#9ba1b2;
    --line:#e6e8f0; --bg:#ffffff;
    --ok-bg:#e6f5ec; --ok-fg:#17663a;
    --no-bg:#ffeceb; --no-fg:#c4322a;
    --hot-bg:#fff1e6; --hot-fg:#a85a12;
    --tip-bg:#edecfb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);
    font-family:'Inter','Noto Sans KR',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;background:rgba(255,255,255,.97);
    backdrop-filter:blur(8px);z-index:600;border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top)}
  .htop{display:flex;align-items:flex-start;justify-content:space-between;
    padding:14px 0 6px;gap:10px}
  .titleblock{min-width:0}
  /* 서비스가 무엇을 해주는지 한 줄. 제목만으로는 알 수 없다. */
  .tagline{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px;
    letter-spacing:-.1px}
  h1{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
  .hright{display:flex;align-items:center;gap:7px}

  /* 목록 / 지도 */
  .vt{display:inline-flex;background:#f1f2f8;border-radius:10px;padding:3px}
  .vt button{border:none;background:none;font:inherit;font-size:13px;font-weight:700;
    color:var(--muted);padding:7px 13px;border-radius:8px;cursor:pointer}
  .vt button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,13,20,.12)}

  /* 언어 */
  .lang{position:relative}
  .lbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;
    font:inherit;font-size:13px;font-weight:700;color:var(--ink);
    padding:8px 11px;cursor:pointer;white-space:nowrap}
  .lmenu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:700;
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;
    min-width:150px;box-shadow:0 10px 30px rgba(11,13,20,.14)}
  .lmenu.on{display:block}
  .lmenu div{padding:10px 12px;border-radius:8px;font-size:14px;color:var(--text);
    cursor:pointer;display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
  .lmenu div:hover{background:#f4f5fa}
  .lmenu div.sel{color:var(--brand);font-weight:700}

  .where{font-family:inherit;border:none;background:none;cursor:pointer;padding:0 0 10px;
    font-size:12.5px;color:var(--muted);display:block;text-align:left}
  .where b{color:var(--brand);font-weight:700}
  .where.off,.where.off b{color:var(--no-fg)}
  .where.off b{text-decoration:underline}

  .sbar{display:flex;align-items:center;gap:9px;background:#f4f5fa;
    border-radius:12px;padding:11px 13px;margin-bottom:11px}
  .sic{color:var(--faint);font-size:16px;line-height:1}
  .sbar input{flex:1;border:none;outline:none;background:none;font:inherit;
    font-size:15px;color:var(--ink);min-width:0}
  .sbar input::placeholder{color:var(--faint)}
  .sx{border:none;background:none;font-size:20px;color:var(--faint);
    cursor:pointer;line-height:1;padding:0 2px;font-family:inherit}

  .chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  /* 조건 칩 — 도구는 작아야 한다.
     칩이 크면 화면 위쪽을 다 먹어서 정작 봐야 할 카드가 밀린다.
     테두리를 지우고 옅은 바탕으로 두면, 선택된 것만 또렷하게 보인다. */
  .chip{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;
    font-size:12.5px;font-weight:600;padding:6px 11px;
    border-radius:8px;border:none;background:#f1f2f8;
    color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit;
    line-height:1.3}
  .chip .ci{font-size:12.5px;line-height:1}
  .chip:hover{background:#e8eaf4;color:var(--ink)}
  .chip.on{background:var(--brand);color:#fff}

  /* ── Decision Cards ─────────────────────────────────── */
  .list{padding:8px 0 18px}
  .row{border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 0 14px;
    cursor:pointer;background:#fff;box-shadow:0 2px 10px rgba(11,13,20,.04)}
  .decision-main{display:grid;grid-template-columns:184px minmax(0,1fr);gap:15px}

  /* 음식 사진.
     부산관광공사가 주는 이미지(_ttiel)는 목록용으로 이미 잘린 썸네일이라,
     contain 으로 둬도 잘린 사진에 여백만 더해질 뿐이었다.
     원본을 구하기 전까지는 cover 로 칸을 채우는 편이 덜 어색하다. */
  .ph{width:184px;height:138px;border-radius:12px;flex-shrink:0;
    background:#f4f5fa;display:flex;align-items:center;justify-content:center;
    overflow:hidden;font-size:34px}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .dhead{min-width:0}
  .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .nameblock{min-width:0;flex:1}
  /* 긴 이름은 두 줄까지만. 그 이상은 … 로 끝내 거리 표시와 겹치지 않게 한다 */
  /* 이름 — 한 줄에 담는 것을 우선한다.
     로마자 상호는 길어지기 쉬우므로 자간을 좁히고,
     그래도 넘치면 두 번째 줄로 가되 단어 중간에서 끊기지 않게 한다. */
  .en{font-size:17px;font-weight:800;color:var(--ink);line-height:1.25;letter-spacing:-.5px;
    display:-webkit-box;-webkit-box-orient:vertical;
    -webkit-line-clamp:2;line-clamp:2;
    overflow:hidden;overflow-wrap:break-word;word-break:normal}
  .ko{font-size:12px;color:var(--faint);margin-top:3px;font-family:'Noto Sans KR',sans-serif}
  .area{font-size:11px;font-weight:600;color:var(--faint);margin-top:2px}
  /* 거리 — 한 줄로 붙여 두되, 이름이 먼저 읽혀야 하므로 작게 둔다 */
  .distance{flex-shrink:0;text-align:right;min-width:52px}
  .walk{font-size:12.5px;font-weight:800;color:var(--brand);white-space:nowrap;line-height:1.25;
    letter-spacing:-.2px}
  .meters{font-size:10.5px;font-weight:600;color:var(--faint);margin-top:2px;white-space:nowrap}
  /* 뱃지 — 아이콘과 한 단어면 충분하다.
     부제("spice level")까지 넣으면 세 층이 되어 카드가 두꺼워지고,
     좁은 칸에서는 그 부제가 잘려 "spice le…" 처럼 보인다. */
  .decision-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .dtag{display:inline-flex;align-items:center;gap:5px;border-radius:9px;
    padding:5px 9px;font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap}
  .dtag .ico{font-size:13px;line-height:1}
  .dtag.ok{background:var(--ok-bg);color:var(--ok-fg)}
  .dtag.hot{background:var(--hot-bg);color:var(--hot-fg)}
  .dtag.tip{background:var(--tip-bg);color:var(--brand)}
  .dtag.neutral{background:#f4f5fa;color:var(--muted)}
  .decision-summary{margin-top:11px;padding:9px 11px;background:#f7f8fc;border-radius:10px;
    font-size:12.5px;color:var(--text);line-height:1.45}
  .decision-summary b{color:var(--ink)}
  /* 부가정보 — 카드를 넘지 않게.
     "How to eat"은 짧아 고정하고, 긴 메뉴만 줄여서 … 로 끝낸다. */
  .secondary{display:flex;align-items:center;gap:10px;margin-top:10px;padding:0 2px;
    font-size:12px;font-weight:700;color:var(--brand);min-width:0}
  .secondary .how{white-space:nowrap;flex-shrink:0}
  .secondary .menu{flex:1;min-width:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .secondary .sep{color:var(--line);font-weight:400;flex-shrink:0}
  .unknown-line{margin-top:9px;font-size:11px;color:var(--faint);line-height:1.4}
  .open{display:none;margin-top:12px;padding:13px 14px;background:#f7f8fc;border-radius:12px}
  .row.on .open{display:block}
  .steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .sp{font-size:12.5px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;line-height:1.3}
  .sp b{color:var(--brand);margin-right:4px}
  /* 주의 — 얇은 띠로. 내용만큼만 높이를 차지한다 */
  .warn{display:block;height:auto;min-height:0;
    font-size:12.5px;color:var(--hot-fg);background:var(--hot-bg);
    border-left:3px solid var(--hot-fg);border-radius:0 9px 9px 0;
    padding:10px 12px;line-height:1.55;margin-bottom:10px}
  .warn .say{display:block;margin-top:6px;font-weight:700;
    font-family:'Noto Sans KR',sans-serif}
  .mn{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:9px}
  .addr{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px}
  .go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--brand);color:#fff;border:none;border-radius:11px;padding:13px;
    font:inherit;font-size:14.5px;font-weight:700;text-decoration:none}
  @media (max-width:430px){
    .decision-main{grid-template-columns:132px minmax(0,1fr);gap:12px}
    .ph{width:132px;height:99px}.en{font-size:16px}
    .decision-tags{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

  /* ── 지도 ─────────────────────────────────────────── */
  #map{display:none;height:65vh;min-height:380px;border-radius:14px;
    border:1px solid var(--line);margin-bottom:10px;z-index:1}
  .pin span{display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;line-height:1;font-size:15px;
    background:#fff;border:2.5px solid var(--brand);box-shadow:0 2px 7px rgba(11,13,20,.28)}
  .pin.me span{background:var(--brand);border-color:#fff}
  .leaflet-popup-content{margin:11px 13px;font-family:'Inter','Noto Sans KR',sans-serif}
  .pp .n{font-size:14px;font-weight:700;color:var(--ink);line-height:1.3}
  .pp .k{font-size:11.5px;color:var(--faint);margin-top:1px}
  .pp .b{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px}
  .pp a{font-size:12.5px;font-weight:700;color:var(--brand);text-decoration:none}

  .msg{padding:48px 20px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6}
  .msg b{color:var(--ink);display:block;font-size:16px;margin-bottom:6px}
  .morebtn{background:#fff;border:1.5px solid var(--line);border-radius:11px;
    padding:13px 26px;font:inherit;font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer}
  .foot{padding:18px 0 96px;text-align:center;font-size:11.5px;
    color:var(--faint);line-height:1.7;border-top:1px solid var(--line)}
  .foot a{color:var(--brand);text-decoration:none}

  /* ── 담기 · 공유 ─────────────────────────────────────
     동행에게 "여기 가자"를 보내는 기능. 계정 없이 링크 하나로. */
  .pickbtn{margin-top:8px;width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--line);background:#fff;color:var(--muted);
    font:inherit;font-size:16px;font-weight:700;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-left:auto}
  .pickbtn:hover{border-color:var(--brand);color:var(--brand)}
  .pickbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}

  /* 하단 바 — 담은 게 있을 때만 올라온다 */
  .pickbar{position:fixed;left:0;right:0;bottom:0;z-index:800;
    display:none;align-items:center;gap:10px;
    max-width:520px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line)}
  .pickbar.on{display:flex}
  .pickbar .n{flex:1;font-size:14px;font-weight:700;color:var(--ink)}
  .pickbar button{font:inherit;font-size:14px;font-weight:700;border-radius:10px;
    padding:10px 16px;cursor:pointer;white-space:nowrap}
  .pickbar .ghost{background:#fff;border:1.5px solid var(--line);color:var(--muted)}
  .pickbar .solid{background:var(--brand);border:none;color:#fff}

  /* 공유 링크로 들어왔을 때 */
  .sharedbar{background:var(--tip-bg);border-radius:14px;padding:14px 16px;
    margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .sharedbar .st{font-size:14px;font-weight:800;color:var(--brand)}
  .sharedbar .ss{font-size:12.5px;color:var(--muted);margin-top:2px}
  .sharedbar .sb{margin-left:auto;display:flex;gap:7px}
  .sharedbar button{font:inherit;font-size:13px;font-weight:700;border-radius:9px;
    padding:8px 13px;cursor:pointer;white-space:nowrap}
  .sharedbar .ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
  .sharedbar .solid{background:var(--brand);border:none;color:#fff}

  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
    padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;z-index:900}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── 불러오는 중 (스켈레톤) ──────────────────────────
     빈 화면에 "Loading…"만 두면 멈춘 것처럼 보인다.
     카드 모양을 미리 그려두면 곧 무엇이 나올지 알 수 있다. */
  .sk{border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 0 14px;
    background:#fff;display:grid;grid-template-columns:184px minmax(0,1fr);gap:15px}
  .sk-ph{width:184px;height:138px;border-radius:12px}
  .sk-line{height:13px;border-radius:6px;margin-bottom:9px}
  .sk-tag{height:26px;width:88px;border-radius:9px;display:inline-block;margin-right:5px}
  .sk-ph,.sk-line,.sk-tag{
    background:linear-gradient(90deg,#f1f2f8 25%,#e8eaf4 37%,#f1f2f8 63%);
    background-size:400% 100%;animation:sk 1.3s ease infinite}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  @media(max-width:480px){
    .sk{grid-template-columns:132px minmax(0,1fr);gap:12px}
    .sk-ph{width:132px;height:99px}
  }

  /* ── 위치를 못 잡았을 때 고르는 지역 ─────────────────
     "부산 중심에서" 라고만 하면 왜 엉뚱한 곳이 나오는지 알 수 없다.
     어디를 보고 싶은지 직접 고르게 한다. */
  .areapick{background:var(--tip-bg);border-radius:14px;padding:14px 16px;margin-bottom:14px}
  .areapick .t{font-size:13.5px;font-weight:700;color:var(--brand);margin-bottom:4px}
  .areapick .d{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:11px}
  .areapick .row2{display:flex;flex-wrap:wrap;gap:6px}
  .areapick button{font:inherit;font-size:13px;font-weight:700;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:99px;
    padding:8px 14px;cursor:pointer;white-space:nowrap}
  .areapick button:hover{border-color:var(--brand);color:var(--brand)}

  /* ── 검증된 것만 보기 ────────────────────────────────
     미확인 항목이 많으면 목록이 지저분해 보인다.
     확인된 곳만 걸러 볼 수 있게 한다. */

  try {

  try { localStorage.setItem(PICK_KEY, JSON.stringify([...PICKED])); } catch(e){}

  const adding = !PICKED.has(id);
  track(adding ? 'pick_add' : 'pick_remove', { place_id: id, total: PICKED.size + (adding?1:-1) });

  if (adding) trackDecision('save', PLACES.find(x => x.id === id));
  if (adding) PICKED.add(id); else PICKED.delete(id);
  savePicked(); renderPickBar(); render();
}

    navigator.clipboard?.writeText(url).then(() => toast(t('copied')));
  }
}

let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

/* 담은 개수와 공유 버튼 — 하나라도 담았을 때만 나타난다 */

/* ── PMF 검증 지표 ─────────────────────────────────────
   이 서비스가 실제로 쓸모 있는지는 세 가지 질문으로 갈린다.

   ① 네이버·구글을 두고 굳이 여기서 조건을 먼저 검색하는가
      → Click_Filter 빈도로 본다. 필터를 안 쓰면 그냥 지도의 열화판이다.

   ② 제공한 사실을 믿고 곧바로 움직이는가
      → Click_Direction / Click_Copy_Address 로 본다.
        상세를 열어보는 것과 실제로 가는 것은 다르다.

   ③ 정보가 틀렸을 때 스스로 고치려 드는가
      → Report_Info 로 본다. 이게 일어나면 데이터가 자라기 시작한다.

   여기에 시간과 이탈을 더해 판단한다. */
const SESSION = {
  start: Date.now(),
  filterUses: 0,        // 조건을 몇 번 바꿨나
  decided: false,       // 한 곳이라도 "가겠다"고 눌렀나
  lastZeroFilter: null, // 결과가 0이었던 마지막 조건
  zeroAt: 0,            // 그 시각
};

/* 진입부터 결정까지 걸린 시간(초).
   목표는 30초 안이다. 그보다 오래 걸리면 "1초 판단"이 아니다. */
const secsSinceStart = () => Math.round((Date.now() - SESSION.start) / 1000);

/* 결정 행동 — 상세를 본 것과 실제로 가는 것은 다르다.
   지도·길찾기·주소 복사가 "가겠다"에 가장 가까운 신호다. */
function trackDecision(kind, p){
  const first = !SESSION.decided;
  SESSION.decided = true;
  track('Decision_Action', {
    action: kind,                        // direction | copy_address | save
    place_id: p ? p.id : '',
    place_name: p ? (p.name_en || p.name_ko) : '',
    category: p ? p.category : '',
    seconds_to_decision: secsSinceStart(),
    is_first_decision: first,
    filters_used: SESSION.filterUses,
  });
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 장소 이름 — 현재 언어로. 부산시 API가 일/중문판에서도 한글 상호를 주는 일이 있어,
   이름이 한글이면 로마자 표기로 대체한다. */
function nameOf(p){
  const v = p.i18n && p.i18n[LANG] && p.i18n[LANG].name;
  if (v && !/[가-힣]/.test(v)) return v;
  return p.name_en || p.name_ko;
}

function distM(a, b){
  const R = 6371000, d = Math.PI / 180;
  const x = Math.sin((b.lat-a.lat)*d/2)**2
    + Math.cos(a.lat*d) * Math.cos(b.lat*d) * Math.sin((b.lng-a.lng)*d/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
const fmtDist = m => m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(1) + ' km';

function tagsOf(p){

  if (p.solo_ok === true)       g.push(['t-ok',  t('b_solo')]);

  if (p.foreign_card === true)  g.push(['t-ok',  t('b_card')]);
  if (p.foreign_card === false) g.push(['t-no',  t('b_cash')]);
  if (p.english_menu === true)  g.push(['t-ok',  t('b_menu')]);
  if (p.english_menu === false) g.push(['t-no',  t('b_komenu')]);
  if (p.spice_level)            g.push(['t-hot', p.spice_level.replace(/🌶️?/g,'').trim()]);
  if (p.food_guide_key && GUIDES[p.food_guide_key]) g.push(['t-tip', t('b_how')]);
  return g;
}

function unknownOf(p){

/* ── 화면에 보여줄 이름 만들기 ─────────────────────────
   DB의 name_en 은 부산시 API 가 준 로마자 표기를 그대로 담고 있다.
   "쌍둥이돼지국밥" → "Ssangdungidwaejigukbap" 처럼 통째로 붙어 있어
   40자짜리 한 덩어리는 읽을 수가 없다.

   DB 를 고치지 않고 여기서만 다듬는다.
   규칙이 틀려도 원본은 그대로라 언제든 되돌릴 수 있기 때문이다.
   지도 링크는 name_ko 를 쓰므로 영향받지 않는다. */

/* 띄울 지점이 되는 말들. 음식·업종 이름은 반복되므로 사전이 통한다.
   긴 것을 먼저 둬야 "dwaejigukbap"이 "Dwaeji Gukbap"으로 두 번 나뉜다. */
const SPLIT_WORDS = [
  // 업종·접미 (뒤에서 떼어낼 것들)
  'jeonmunjeom','bonjeom','jikyeongjeom','sindosijeom','bonkwan','bonga',
  // 국물·탕
  'dwaejigukbap','seonjigukbap','jaecheopguk','samgyetang','haemultang',
  'haemuljjim','eotangguksu','gukbap','bokguk','kalguksu','guksu',
  'jeongol','jjigae','tang',
  // 면
  'naengmyeon','laengmyeon','raengmyeon','milmyeon','myeonok',
  // 고기·해산물
  'dwaejigalbi','amsogalbi','gogalbi','galbi','bulgogi','sutbul','gopchang',
  'sundae','suyuk','bossam','jokbal','yukjeon','yukoe','yungmyeon',
  'nakji','jjukkumi','gajami','jeonbok','haemul','mulhoe','kkomjangeo',
  'hoetjip','chobap','galchi','godeungeo','yakkong',
  // 조리·형태
  'jjim','bokkeum','syabeusyabeu','kkakdugi','jeukseokgui','matjip',
  // 장소·업종
  'sikdang','siktang','bunsik','hanjeongsik','pocha','chon',
  'danji','senteo','yeonguso','keopi','pateuseuri','paseuta',
];
SPLIT_WORDS.sort((a, b) => b.length - a.length);

const cap = w => w.charAt(0).toUpperCase() + w.slice(1);

/* 붙어 있는 한 덩어리를 사전에 있는 말 앞에서 자른다. */
function splitToken(token, depth = 0){
  if (depth > 6 || token.length < 8) return [token];
  const lower = token.toLowerCase();

  // 끝에서 먼저 찾는다 (…gukbap, …bonjeom)
  for (const w of SPLIT_WORDS){
    const at = lower.lastIndexOf(w);
    if (at >= 3 && at + w.length === lower.length){
      return [...splitToken(token.slice(0, at), depth + 1), cap(token.slice(at))];
    }
  }
  // 중간에도 찾아본다 (…gukbap + jeonmunjeom 처럼 뒤에 더 붙은 경우)
  for (const w of SPLIT_WORDS){
    const at = lower.indexOf(w);
    if (at >= 3){
      const head = token.slice(0, at);
      const mid  = cap(token.slice(at, at + w.length));
      const rest = token.slice(at + w.length);
      return rest
        ? [...splitToken(head, depth + 1), mid, ...splitToken(cap(rest), depth + 1)]
        : [...splitToken(head, depth + 1), mid];
    }
  }
  return [token];
}

/* 지점 표시 — 로마자로 옮기면 Bonjeom · Gwangallijeom 이 되어
   외국인에게 아무 뜻이 없다. 지역은 이미 따로 표시되므로 화면에서는 뗀다. */
/* 지점 표시.
   "반점(banjeom)"은 중국집 이름의 일부이지 지점이 아니다.
   그냥 -jeom 으로 끝나는 것을 다 자르면 "동화반점"이 "Donghwaban"이 된다.
   그래서 지점을 뜻하는 형태만 골라 적는다. */
const BRANCH_TAILS = [
  // 단독으로 붙은 경우
  /^bonjeom$/i, /^bonkwan$/i, /^jeonmunjeom$/i, /^jikyeongjeom$/i,
  /^sindosijeom$/i, /^\d+hojeom$/i,
  // 앞말과 붙은 경우 — 앞에 두 글자 이상이 있어야 한다
  /..bonjeom$/i,        // Busanbonjeom, Guseobonjeom, Gwangallibonjeom
  /..jeonmunjeom$/i,    // Gwaebeopjjukkumijeonmunjeom
  /..sindosijeom$/i,    // Gaemijipsindosijeom
  /..hojeom$/i,
  // 지역명 + 점 — 반점·상점 같은 상호는 제외한다
  /(?<!ban)(?<!sang)(?<!bap)jeom$/i,
  // 한글
  /^본점$/, /^본관$/, /^전문점$/, /^직영점$/,
  /(?<!반)(?<!상)점$/,
];

/* 지점 뒤에 붙은 지역명.
   "대연본점"에서 "본점"을 떼면 "대연"이 남는데,
   화면에는 이미 지역이 따로 표시되므로 중복이다.
   여행자에게 "대연"이 어디인지도 의미가 없다.

   다만 같은 상호가 여러 곳이면 구분이 필요하므로,
   그런 곳은 예외로 남긴다. */
const KEEP_BRANCH = ['tonsyou', '톤쇼우'];

/* 지점 뒤에 흔히 붙는 지역명. 카드에 지역이 따로 나오므로 화면에서는 뗀다. */
const AREA_WORDS = [
  'busan','haeundae','seomyeon','gwangalli','gwangan','nampo','yeongdo',
  'gamcheon','songdo','choryang','dongnae','geumjeong','gijang','guseo',
  'daeyeon','jeonpo','oncheoncheon','sasang','yeonje','busandae','songjeong',
  'sindosi','gukjesindosi','cheonseonghang','yeonsan','minrak','centum',
];

function shortName(raw){
  if (!raw) return '';

  // ① 공백 기준으로 나눈 뒤 각 덩어리를 다시 쪼갠다
  let parts = raw.trim().split(/\s+/).filter(Boolean)
    .flatMap(t => splitToken(t));

  const keep = KEEP_BRANCH.some(k => raw.toLowerCase().includes(k));

  /* ② 뒤쪽의 지점 표시를 뗀다.
     같은 상호가 여러 곳인 경우(톤쇼우 광안점 / 부산대점)에는
     지역명까지 사라지면 구분이 안 되므로, "점"만 떼고 지역은 남긴다. */
  while (parts.length > 1 && BRANCH_TAILS.some(re => re.test(parts[parts.length - 1]))){
    const last = parts[parts.length - 1];
    if (keep){
      // Gwanganjeom → Gwangan, Busandaejeom → Busandae
      const trimmed = last.replace(/jeom$/i, '').replace(/점$/, '');
      if (trimmed.length >= 3){ parts[parts.length - 1] = trimmed; break; }
    }
    parts.pop();
  }

  /* ③ 지점을 뗀 자리에 지역명이 남는 경우가 있다.
     "Baebijang Bossam Guseo" 의 Guseo 같은 것들이다.
     지역은 카드에 따로 표시되므로 뗀다 — 단 두 단어 이상 남을 때만. */
  if (!keep && parts.length > 2){
    const last = parts[parts.length - 1];
    if (AREA_WORDS.some(w => last.toLowerCase() === w)) parts.pop();
  }

  /* 로마자 표기 규칙 때문에 자음이 겹치는 경우가 있다.
     "부산약콩" → Busannyakkong 을 자르면 "Busann Yakkong" 이 된다.
     끝에 남은 중복 자음을 하나로 줄인다. */
  parts = parts.map(w => w.replace(/([bcdfgjklmnprstw])\1$/i, '$1'));

  const out = parts.join(' ').replace(/[\s·\-]+$/, '').trim();

  // ③ 너무 짧아졌으면(개미집신도시점 → 개미) 원본을 그대로 쓴다
  const min = /[가-힣]/.test(out) ? 2 : 4;
  return out.length >= min ? out : raw;
}

/* 대표메뉴 — 가격을 먼저 통째로 지운 뒤 쪼갠다.
   쉼표부터 나누면 "￦12,000"이 "000" 파편으로 남는다.
   카드에서는 괄호 안 설명까지 떼야 한 줄에 들어간다. */
function menuOf(p, { short = false } = {}){
  const items = (p.subcategory || '')
    .replace(/[￦₩][^\S\n]*[\d][\d,\-–~]*/g, '')
    .replace(/^(Korean|Chinese|Japanese|Western|Snack bar|Cafe)\s*·\s*/i, '')
    .split(/[\n,·]/).map(x => x.replace(/\s{2,}/g, ' ').trim())
    .filter(x => x && x.length > 1 && /[a-zA-Z가-힣]/.test(x));

  if (short){
    return items.slice(0, 2)
      .map(x => x.replace(/\s*\([^)]*\)\s*/g, ' ').trim())
      .filter(Boolean).join(' · ');
  }
  return items.slice(0, 2).join(' · ');
}

function stepsOf(p){
  const g = GUIDES[p.food_guide_key];
  if (!g) return null;
  const loc = g.i18n && g.i18n[LANG];
  const raw = (loc && loc.steps) || g.steps;
  if (!raw || !raw.length) return null;
  /* 안내문은 길어서 첫 문장만 쓰되,
     "이럴 땐 이렇게 말하라"는 한국어 문장은 반드시 함께 보여준다.
     그게 빠지면 경고만 하고 대처법이 없는 셈이 된다. */
  const full  = ((loc && loc.pro_tip) || g.pro_tip || '').replace(/\s+/g, ' ').trim();
  const first = (full.split(/(?<=[.!?。！？])\s+/)[0] || '').slice(0, 150);
  const m = full.match(/"([^"]*[가-힣][^"]*)"|([가-힣][가-힣\s]{2,}(?:주세요|없어요|있어요))/);
  const say = m ? (m[1] || m[2] || '').trim() : '';

  return {
    steps: raw.slice(0,3).map(x => (x.split('|')[0] || '').trim()
      .replace(/^\p{Extended_Pictographic}[\uFE0F\u200D\p{Extended_Pictographic}]*\s*/u, '')),
    tip: first,
    say,
  };
}

function matchQuery(p){
  if (!query) return true;
  const hay = [p.name_en, p.name_ko, nameOf(p), p.address, p.area, areaLabel(p.area)]
    .filter(Boolean).join(' ').toLowerCase();
  return hay.includes(query);
}

/* 확인된 항목이 하나라도 있는 곳인지.
   미확인만 잔뜩 있으면 판단에 도움이 안 되므로 걸러낼 수 있게 한다. */
function hasChecked(p){
  return p.solo_ok != null || p.foreign_card != null ||
         p.english_menu != null || !!p.spice_level || !!p.food_guide_key;
}

function currentList(){
  // 공유 링크로 들어왔으면 그 목록만. 순서도 보낸 사람 순서대로.
  if (sharedMode){
    const order = new Map(sharedIds.map((id, i) => [id, i]));
    return PLACES.filter(p => order.has(p.id))
                 .sort((a, b) => order.get(a.id) - order.get(b.id));
  }
  const f = FILTERS.find(x => x.key === cur) || FILTERS[0];
  return PLACES.filter(p =>
    f.test(p) && matchQuery(p) && (!onlyChecked || hasChecked(p)));
}

/* 불러오는 동안 카드 모양을 미리 그린다.
   빈 화면보다 무엇이 나올지 알기 쉽고, 멈춘 것처럼 보이지 않는다. */
function skeleton(n = 3){
  return Array.from({ length: n }, () => `
    <div class="sk">
      <div class="sk-ph"></div>
      <div>
        <div class="sk-line" style="width:62%;height:17px"></div>
        <div class="sk-line" style="width:38%"></div>
        <div style="margin-top:14px">
          <span class="sk-tag"></span><span class="sk-tag" style="width:74px"></span>
        </div>
      </div>
    </div>`).join('');
}

/* 위치를 못 잡았을 때 — 어디를 볼지 직접 고르게 한다.
   그냥 부산 중심 기준으로 뿌리면 "왜 엉뚱한 게 나오지"가 된다. */
function areaPicker(){
  if (whereState.ok || pickedArea || sharedMode) return '';
  return `<div class="areapick">
    <div class="t">${t('pickArea')}</div>
    <div class="d">${t('pickAreaDesc')}</div>
    <div class="row2">${AREA_SPOTS.map(a =>
      `<button data-area="${esc(a.key)}">${esc(a.label)}</button>`).join('')}</div>
  </div>`;
}

function render(){
  const box = document.getElementById('list');
  if (!box) return;
  const all = currentList();

  if (loading){ box.innerHTML = skeleton(); return; }
  if (mapView){ renderMap(all); box.innerHTML = ''; return; }

  /* 조건을 걸었는데 결과가 0이면 기록해 둔다.
     그 상태에서 그냥 나가버리면(Zero_Result_Exit) 데이터가 부족하다는 뜻이다.
     "혼밥 + 안 매움" 같은 날카로운 조합에서 자주 일어난다. */
  if (!all.length && (cur !== 'all' || query)){
    SESSION.lastZeroFilter = `${cur}${query ? '+search' : ''}`;
    SESSION.zeroAt = Date.now();
    track('Zero_Result', {
      filter: cur,
      has_query: !!query,
      only_checked: onlyChecked,
      area: pickedArea ? pickedArea.label : (whereState.ok ? 'near_me' : 'centre'),
    });
  }

  if (!all.length){
    box.innerHTML = query
      ? `<div class="msg"><b>${t('noMatch')} "${esc(query)}"</b>${t('tryArea')}</div>`
      : `<div class="msg"><b>${t('nothingNear')}</b>${t('tryArea2')}</div>
         <div class="areapick"><div class="row2">${AREA_SPOTS.map(a =>
           `<button data-area="${esc(a.key)}">${esc(a.label)}</button>`).join('')}</div></div>`;
    return;
  }

  // 보내준 목록으로 들어왔을 때 — 무엇을 보고 있는지 먼저 알린다
  const banner = sharedMode ? `
    <div class="sharedbar">
      <div>
        <div class="st">🔗 ${t('sharedList')}</div>
        <div class="ss">${t('sharedBy').replace('{n}', all.length)}</div>
      </div>
      <div class="sb">
        <button class="ghost" id="shared-all">${t('backToAll')}</button>
        <button class="solid" id="shared-save">${t('saveThese')}</button>
      </div>
    </div>` : '';

  // 확인된 곳만 보기 — 미확인이 많으면 목록이 지저분해 보인다
  const toggle = `
    <label class="onlych ${onlyChecked?'on':''}">
      <input type="checkbox" id="only-checked" ${onlyChecked?'checked':''}>
      ${t('onlyCheckedLabel')}
    </label>`;

  box.innerHTML = areaPicker() + banner + toggle + all.slice(0, shown).map(p => {
    const unk = unknownOf(p);
    const g = stepsOf(p);
    const menu = menuOf(p, { short: true });   // 카드 한 줄용 (괄호 설명 제외)
    const menuFull = menuOf(p);                // 펼쳤을 때 (설명 포함)
    const naver = 'https://map.naver.com/p/search/' + encodeURIComponent(p.name_ko || p.name_en);
    // 사진이 없거나 불러오지 못하면 카테고리 이모지로 대체한다
    const face = CAT_FACE[p.category] || '📍';
    const ph = p.image_url
      ? `<img src="${esc(p.image_url)}" alt="" loading="lazy"
             onerror="this.remove();this.parentNode.textContent='${face}'">`
      : face;

    const solo = p.solo_ok === true;
    const card = p.foreign_card === true;
    const menuOk = p.english_menu === true;
    const hasSpice = !!p.spice_level;
    const mild = /mild/i.test(p.spice_level || '');

    const decisionTags = [
      solo ? `<span class="dtag ok"><span class="ico">👤</span>${t('b_solo')}</span>` : '',
      card ? `<span class="dtag ok"><span class="ico">💳</span>${t('b_card')}</span>` : '',
      menuOk ? `<span class="dtag tip"><span class="ico">🔤</span>${t('b_menu')}</span>` : '',
      hasSpice ? `<span class="dtag ${mild?'hot':'neutral'}"><span class="ico">🌶️</span>${esc(p.spice_level.replace(/🌶️?/g,'').trim())}</span>` : ''
    ].filter(Boolean).slice(0,4).join('');

    const fallback = !decisionTags
      ? `<div class="decision-summary">${t('noneChecked')}</div>`
      : '';

    // 도보 4km/h = 분당 약 67m. 신호와 골목을 감안해 넉넉히 잡는다.
    const walk = p._d != null
      ? t('walk').replace('{n}', String(Math.max(1, Math.round(p._d / 67))))
      : '';

    return `<div class="row ${openId===p.id?'on':''}" data-id="${esc(p.id)}">
      <div class="decision-main">
        <div class="ph">${ph}</div>
        <div class="dhead">
          <div class="topline">
            <div class="nameblock">
              <div class="en" title="${esc(nameOf(p))}">${esc(shortName(nameOf(p)))}</div>
              ${p.name_ko?`<div class="ko">${esc(p.name_ko)}</div>`:''}
              ${p.area?`<div class="area">📍 ${esc(areaLabel(p.area))}</div>`:''}
            </div>
            <div class="distance">
              ${walk?`<div class="walk">🚶 ${esc(walk)}</div>`:''}
              ${p._d!=null?`<div class="meters">${esc(fmtDist(p._d))}</div>`:''}
              <button class="pickbtn ${PICKED.has(p.id)?'on':''}" data-pick="${esc(p.id)}"
                title="${PICKED.has(p.id)?esc(t('picked')):esc(t('pick'))}"
                >${PICKED.has(p.id)?'✓':'+'}</button>
            </div>
          </div>

          ${decisionTags ? `<div class="decision-tags">${decisionTags}</div>` : fallback}

          ${g || menu ? `<div class="secondary">
            ${g?`<span class="how">🍴 ${t('b_how')}</span>`:''}
            ${g && menu?`<span class="sep">|</span>`:''}
            ${menu?`<span class="menu" title="${esc(menu)}">▧ ${esc(menu)}</span>`:''}
          </div>` : ''}

          ${unk.length?`<div class="unknown-line">${t('notConfirmed')}: ${unk.join(' · ')}</div>`:''}
        </div>
      </div>

      <div class="open">
        ${g?`<div class="steps">${g.steps.map((s,i)=>`<span class="sp"><b>${i+1}</b>${esc(s)}</span>`).join('')}</div>`:''}
        ${g&&g.tip?`<div class="warn">${esc(g.tip)}${
          g.say?`<span class="say">→ ${esc(g.say)}</span>`:''}</div>`:''}
        ${menuFull?`<div class="mn">${esc(menuFull)}</div>`:''}
        ${p.address?`<div class="addr">
          <span>📍 ${esc(p.address)}</span>
          <button class="copybtn" data-copy="${esc(p.id)}">${t('copyAddr')}</button>
        </div>`:''}
        <a class="go" href="${naver}" data-dir="${esc(p.id)}" target="_blank" rel="noopener">${t('naver')}</a>
        <button class="reportbtn" data-report="${esc(p.id)}">${t('report')}</button>
      </div>
    </div>`;
    }).join('') + (all.length > shown
    ? `<div class="msg" style="padding:20px"><button class="morebtn" id="more">${t('more')}</button></div>` : '');
}

function renderMap(list){
  if (typeof L === 'undefined') return;
  if (!lmap){
    lmap = L.map('map', { scrollWheelZoom:false }).setView([BUSAN.lat, BUSAN.lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(lmap);
    lmap.on('click', () => lmap.scrollWheelZoom.enable());
  }
  if (layer) lmap.removeLayer(layer);
  layer = L.layerGroup();

  list.slice(0, 200).forEach(p => {
    const icon = L.divIcon({ className:'pin',
      html:`<span>${CAT_FACE[p.category]||'📍'}</span>`,
      iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] });
    const tags = tagsOf(p).slice(0,3)
      .map(([c,l])=>`<span class="t ${c}">${esc(l)}</span>`).join('');
    const naver = 'https://map.naver.com/p/search/' + encodeURIComponent(p.name_ko || p.name_en);
    L.marker([p.lat,p.lng],{icon}).bindPopup(`<div class="pp">
      <div class="n">${esc(nameOf(p))}</div>
      ${p.name_ko?`<div class="k">${esc(p.name_ko)}</div>`:''}
      ${tags?`<div class="b">${tags}</div>`:''}
      <a href="${naver}" target="_blank" rel="noopener">${t('naver')} →</a></div>`).addTo(layer);
  });

  if (me){
    meMarker = L.marker([me.lat, me.lng], { icon: L.divIcon({
      className:'pin me', html:'<span>🧍</span>', iconSize:[30,30], iconAnchor:[15,15] })});
    meMarker.addTo(layer);
  }
  layer.addTo(lmap);

  const pts = list.filter(p=>p.lat&&p.lng).slice(0,60).map(p=>[p.lat,p.lng]);
  if (me) pts.push([me.lat, me.lng]);
  if (pts.length) lmap.fitBounds(L.latLngBounds(pts), { padding:[35,35], maxZoom:16 });
  setTimeout(()=>lmap.invalidateSize(), 60);
}

/* 지역 줄 — 항상 보인다.
   위치를 못 잡았을 때뿐 아니라, 잡혔더라도 "내일은 남포동" 처럼
   다른 동네를 미리 볼 수 있어야 하기 때문이다. */
function renderAreas(){
  const box = document.getElementById('areas');
  if (!box) return;
  const nearOn = !pickedArea;
  box.innerHTML =
    `<button class="area ${nearOn ? 'on' : ''}" data-area="near">📍 ${t('nearMe')}</button>` +
    `<span class="sep"></span>` +
    AREA_SPOTS.map(a =>
      `<button class="area ${pickedArea && pickedArea.key === a.key ? 'on' : ''}"
        data-area="${esc(a.key)}">${esc(a.label)}</button>`).join('');
}

function renderChips(){
  const box = document.getElementById('chips');
  if (!box) return;

  /* 데이터가 오기 전에는 개수를 셀 수 없다.
     그때 개수 0을 이유로 숨기면 칩이 "All" 하나만 남아
     화면이 텅 빈 것처럼 보인다. 로딩 중에는 전부 보여준다. */
  box.innerHTML = FILTERS.map(f => {
    if (!loading){
      const n = PLACES.filter(f.test).length;
      if (!n && f.key !== 'all') return '';
    }
    return `<button class="chip ${cur===f.key?'on':''}" data-f="${f.key}">${
      f.ic ? `<span class="ci">${f.ic}</span>` : ''}${t(f.lb)}</button>`;
  }).join('');
}

function applyLang(){
  /* 요소 하나가 없어도 화면 전체가 멈추면 안 된다.
     예전에는 여기서 null 을 만나면 그 아래 renderChips·render 가
     아예 실행되지 않아 칩도 목록도 나오지 않았다. */
  const el = id => document.getElementById(id);
  const setTxt  = (id, v) => { const e = el(id); if (e) e.textContent = v; };
  const setHtml = (id, v) => { const e = el(id); if (e) e.innerHTML = v; };

  document.documentElement.lang =
    LANG === 'zh' ? 'zh-Hant' : LANG === 'zhs' ? 'zh-Hans' : LANG;

  // 상단 "Near me"는 서비스 이름이므로 번역하지 않는다.
  setTxt('t-tag',  t('tagline'));
  setTxt('t-list', t('list'));
  setTxt('t-map',  t('map'));
  setTxt('t-foot', t('foot'));
  setTxt('lbtn', ((LANG_META[LANG] || {}).label || 'EN') + ' ▾');

  const q = el('q'); if (q) q.placeholder = t('search');

  setHtml('lmenu', LANGS.map(l =>
    `<div data-l="${l}" class="${l===LANG?'sel':''}"><span>${LANG_META[l].name}</span>${l===LANG?'<span>✓</span>':''}</div>`).join(''));

  renderAreas();
  renderChips();
  render();
  updateWhere();
}

let whereState = { ok:false, msg:'locating' };
function updateWhere(){
  const w = document.getElementById('where');
  if (!w) return;
  // 지역을 직접 골랐으면 그 이름을 보여준다 — 어디 기준인지 분명해야 한다
  if (pickedArea){
    w.className = 'where';
    w.innerHTML = `📍 from <b>${esc(pickedArea.label)}</b>`;
    return;
  }
  w.className = 'where' + (whereState.ok ? '' : ' off');
  w.innerHTML = whereState.msg === 'locating' ? t('locating')
    : whereState.ok ? t('here') : t('centre');
}

function sortByDistance(){
  PLACES.forEach(p => { p._d = me ? distM(me, {lat:p.lat, lng:p.lng}) : null; });
  PLACES.sort((a,b) => (a._d ?? 1e12) - (b._d ?? 1e12));
}

function askLocation(){
  whereState = { ok:false, msg:'locating' };
  updateWhere();

  // 위치를 기다리는 동안에도 목록이 보이게 부산 중심을 기본으로 둔다.
  // 응답이 늦어도 빈 화면을 보지 않도록.
  if (!me) me = BUSAN;

  const settle = (ok) => {
    whereState = { ok, msg: ok ? 'here' : 'centre' };
    track('location', { granted: ok });
    sortByDistance();
    updateWhere();
    if (!loading) render();
  };

  if (!navigator.geolocation) return settle(false);

  navigator.geolocation.getCurrentPosition(
    pos => { me = { lat: pos.coords.latitude, lng: pos.coords.longitude }; settle(true); },
    ()  => { me = BUSAN; settle(false); },
    // 데스크톱은 GPS 가 없어 오래 걸린다. 5초면 충분히 기다린 것으로 본다.
    { enableHighAccuracy: false, timeout: 5000, maximumAge: 120000 }
  );
}

/* ── 시작 ─────────────────────────────────────────────
   순서가 중요하다.
   예전에는 데이터를 다 받은 뒤에야 화면을 그려서,
   조회가 느리거나 실패하면 "Loading…" 에 갇혔다.

   지금은 화면(스켈레톤)을 먼저 띄우고, 위치와 데이터를 따로 돌린다.
   하나가 실패해도 나머지는 계속 간다. */
async function load(){
  applyLang();          // 스켈레톤과 칩을 먼저 그린다
  renderPickBar();
  askLocation();        // 위치는 데이터와 무관하게 따로 요청

  // 먹는 법 가이드는 없어도 목록은 보여야 하므로 실패를 삼킨다
  sb.from('food_guides').select('key, title_en, steps, pro_tip, i18n')
    .then(({ data, error }) => {
      if (error){ console.warn('가이드를 불러오지 못했습니다:', error.message); return; }
      (data || []).forEach(g => GUIDES[g.key] = g);
      if (!loading) render();
    })
    .catch(e => console.warn('가이드 오류:', e));

  // 장소 — 이것만은 있어야 화면이 성립한다
  try {
    const { data, error } = await sb.from('places')
      .select('id, name_en, name_ko, category, subcategory, image_url, address, area, i18n, lat, lng, solo_ok, foreign_card, english_menu, spice_level, food_guide_key')
      .not('lat','is',null).not('lng','is',null);

    if (error) throw error;

    PLACES = data || [];
    loading = false;
    track('nearme_view', { places: PLACES.length, shared: sharedMode });
    sortByDistance();
    renderChips();
    render();
  } catch(e){
    loading = false;
    console.error('장소를 불러오지 못했습니다:', e);
    setHTML('list', `<div class="msg">
      <b>Couldn't load places.</b>
      ${esc(e.message || String(e))}<br><br>
      <button class="morebtn" onclick="location.reload()">Try again</button>
    </div>`);
  }
}

/* 요소가 없어도 오류가 나지 않게 한다 */
function setHTML(id, html){
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
}

/* ── 이벤트 ───────────────────────────────────────────── */
const qInput = document.getElementById('q');
qInput.addEventListener('input', () => {
  query = qInput.value.trim().toLowerCase();
  document.getElementById('qx').style.display = query ? 'block' : 'none';
  shown = 25; openId = null; render();
});

document.addEventListener('click', e => {
  // 지역 고르기 — 위치를 못 잡았을 때 대신 쓴다
  const ap = e.target.closest('[data-area]');
  if (ap){
    // "내 주변"으로 돌아가기
    if (ap.dataset.area === 'near'){
      pickedArea = null;
      askLocation();
      renderAreas();
      return;
    }
    const spot = AREA_SPOTS.find(a => a.key === ap.dataset.area);
    if (spot){
      me = { lat: spot.lat, lng: spot.lng };
      pickedArea = spot;
      whereState = { ok:false, msg:'picked' };
      track('area_pick', { area: spot.label });
      sortByDistance(); updateWhere(); renderAreas(); render();
      window.scrollTo({ top:0, behavior:'smooth' });
    }
    return;
  }

  // 확인된 곳만 보기
  if (e.target.closest('#only-checked')){
    onlyChecked = !onlyChecked;
    shown = 25; openId = null;
    track('only_checked', { on: onlyChecked });
    render();
    return;
  }

  // 담기 / 빼기
  const pk = e.target.closest('[data-pick]');
  if (pk){ e.stopPropagation(); togglePick(pk.dataset.pick); return; }

  if (e.target.closest('#pick-share')){ shareList([...PICKED]); return; }
  if (e.target.closest('#pick-clear')){
    track('pick_clear', { count: PICKED.size });
    PICKED.clear(); savePicked(); renderPickBar(); render(); return;
  }

  // 공유 링크로 들어온 상태에서
  if (e.target.closest('#shared-all')){
    track('shared_exit', {});
    sharedMode = false;
    history.replaceState(null, '', location.pathname);
    renderPickBar(); render(); return;
  }
  if (e.target.closest('#shared-save')){
    track('shared_save', { count: sharedIds.length });
    sharedIds.forEach(id => PICKED.add(id));
    savePicked(); sharedMode = false;
    history.replaceState(null, '', location.pathname);
    renderPickBar(); render(); toast(t('picked')); return;
  }

  const lm = e.target.closest('[data-l]');
  if (lm){
    LANG = lm.dataset.l;
    try { localStorage.setItem('cu_lang', LANG); } catch(err){}
    document.getElementById('lmenu').classList.remove('on');
    applyLang(); return;
  }
  if (e.target.closest('#lbtn')){
    document.getElementById('lmenu').classList.toggle('on'); return;
  }
  document.getElementById('lmenu').classList.remove('on');

  if (e.target.closest('#where')){ pickedArea = null; askLocation(); return; }
  if (e.target.closest('#qx')){
    qInput.value = ''; query = '';
    document.getElementById('qx').style.display = 'none';
    shown = 25; render(); return;
  }
  const vt = e.target.closest('.vt button');
  if (vt){
    mapView = vt.dataset.v === 'map';
    track('view_toggle', { view: vt.dataset.v });
    document.querySelectorAll('.vt button').forEach(b => b.classList.toggle('on', b === vt));
    document.getElementById('map').style.display = mapView ? 'block' : 'none';
    render(); return;
  }
  const chip = e.target.closest('.chip');
  if (chip){ cur = chip.dataset.f; shown = 25; openId = null;
             SESSION.filterUses++;
             /* 조건을 쓰는지가 첫 번째 질문의 답이다.
                안 쓰면 이 서비스는 그냥 지도의 열화판이다. */
             track('Click_Filter', {
               filter: cur,
               use_count: SESSION.filterUses,
               seconds_since_start: secsSinceStart(),
             });
             renderChips(); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if (e.target.closest('#more')){ shown += 25; render(); return; }
  /* 길찾기 — "실제로 가겠다"에 가장 가까운 행동.
     상세를 여는 것과 여기를 누르는 것은 전혀 다른 신호다. */
  const go = e.target.closest('[data-dir]');
  if (go){
    const p = PLACES.find(x => x.id === go.dataset.dir);
    track('Click_Direction', {
      place_id: go.dataset.dir,
      place_name: p ? (p.name_en || p.name_ko) : '',
      category: p ? p.category : '',
      map: 'naver',
    });
    trackDecision('direction', p);
    return;
  }

  /* 주소 복사 — 택시 기사에게 보여주려는 행동.
     길찾기만큼 강한 결정 신호다. */
  const cp = e.target.closest('[data-copy]');
  if (cp){
    e.stopPropagation();
    const p = PLACES.find(x => x.id === cp.dataset.copy);
    const text = p ? `${p.name_ko || p.name_en}\n${p.address || ''}`.trim() : '';
    navigator.clipboard?.writeText(text).then(() => toast(t('copied')));
    track('Click_Copy_Address', {
      place_id: cp.dataset.copy,
      place_name: p ? (p.name_en || p.name_ko) : '',
    });
    trackDecision('copy_address', p);
    return;
  }

  /* 정보 신고 — 틀린 걸 고치려는 움직임.
     이게 일어나기 시작하면 데이터가 스스로 자란다. */
  const rp = e.target.closest('[data-report]');
  if (rp){
    e.stopPropagation();
    const p = PLACES.find(x => x.id === rp.dataset.report);
    track('Report_Info', {
      place_id: rp.dataset.report,
      place_name: p ? (p.name_en || p.name_ko) : '',
      seconds_since_start: secsSinceStart(),
    });
    toast(t('reported'));
    return;
  }
  const row = e.target.closest('.row');
  if (row){
    const opening = openId !== row.dataset.id;
    openId = opening ? row.dataset.id : null;
    if (opening){
      const p = PLACES.find(x => x.id === row.dataset.id);
      track('card_open', {
        place_id: row.dataset.id,
        place_name: p ? (p.name_en || p.name_ko) : '',
        has_guide: !!(p && p.food_guide_key),
        seconds_since_start: secsSinceStart(),
        filters_used: SESSION.filterUses,
      });
    }
    render();
  }
});

/* 떠날 때 한 번 — 이 세션이 무엇으로 끝났는지 남긴다.
   결정까지 갔는지, 조건만 만지다 나갔는지, 0건에서 포기했는지. */
window.addEventListener('pagehide', () => {
  const zeroExit = !!SESSION.lastZeroFilter &&
    (Date.now() - SESSION.zeroAt) < 20000 && !SESSION.decided;

  track('Session_End', {
    seconds: secsSinceStart(),
    filters_used: SESSION.filterUses,
    reached_decision: SESSION.decided,
    zero_result_exit: zeroExit,               // 결과 0에서 그냥 나갔나
    last_zero_filter: SESSION.lastZeroFilter || '',
  });
}, { once: true });

/* ── 홈 화면에 추가 안내 ───────────────────────────────
   대부분 "홈 화면에 추가"라는 기능을 모른다.
   웹은 주소를 기억해야 다시 올 수 있으니, 한 번은 알려준다.
   단, 닫으면 다시 묻지 않는다 — 귀찮게 하면 역효과다. */
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showA2HS('android');
});

function showA2HS(kind){
  try { if (localStorage.getItem('nm_a2hs_done')) return; } catch(e){}
  // 이미 홈 화면에서 열린 상태면 안내할 필요가 없다
  if (window.matchMedia?.('(display-mode: standalone)').matches) return;
  if (window.navigator.standalone) return;

  const box = document.getElementById('a2hs');
  if (!box) return;
  box.className = 'a2hs on';
  box.innerHTML = `
    <div class="ic">📍</div>
    <div class="tx">${kind === 'ios' ? t('addHomeIos') : t('addHome')}</div>
    ${kind === 'android' ? `<button class="solid" id="a2hs-go">${t('addHomeBtn')}</button>` : ''}
    <button class="ghost" id="a2hs-no">${t('later')}</button>`;
  track('a2hs_shown', { kind });
}

/* iOS 는 beforeinstallprompt 가 없어 직접 안내해야 한다.
   방문 20초쯤 뒤에 한 번만 — 들어오자마자 띄우면 방해가 된다. */
(function(){
  const ua = navigator.userAgent || '';
  const isIos = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
  if (isIos && isSafari) setTimeout(() => showA2HS('ios'), 20000);
})();

document.addEventListener('click', (e) => {
  if (e.target.closest('#a2hs-go')){
    track('a2hs_accept', {});
    if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; }
    closeA2HS();
    return;
  }
  if (e.target.closest('#a2hs-no')){ track('a2hs_dismiss', {}); closeA2HS(); }
});

function closeA2HS(){
  try { localStorage.setItem('nm_a2hs_done', '1'); } catch(e){}
  const box = document.getElementById('a2hs');
  if (box){ box.className = ''; box.innerHTML = ''; }
}

load();
</script>

</body>
</html>
