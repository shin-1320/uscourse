<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Near me — B</title>

<!--
  상황 → 판단 → 장소

  앞의 파일에서 질문 화면이 안 나오는 원인을 못 찾아,
  이번에는 그 부분만 따로 만들었습니다.
  복잡한 로직을 걷어내서 무엇이 문제인지 바로 드러나게 했습니다.
-->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --brand:#0300b2; --ink:#0b0d14; --text:#31364a;
    --muted:#6b7185; --faint:#9ba1b2; --line:#e6e8f0;
    --ok-bg:#e6f5ec; --ok-fg:#17663a; --tip-bg:#edecfb;
    --hot-bg:#fff1e6; --hot-fg:#a85a12;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#fff;color:var(--text);
    font-family:'Inter','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 60px}

  header{padding:18px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
  h1{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
  .tag{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}

  /* ── 상황 질문 ─────────────────────────────────────── */
  .ask{padding:24px 0 40px}
  .ask-t{font-size:20px;font-weight:800;color:var(--ink);
    letter-spacing:-.4px;line-height:1.3;margin-bottom:7px}
  .ask-h{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:20px}
  .sit{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:9px;
    padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);
    background:#fff;cursor:pointer;font:inherit;text-align:left}
  .sit.on{border-color:var(--brand);background:var(--tip-bg)}
  .sit .ic{font-size:20px;line-height:1}
  .sit .tx{flex:1;font-size:15px;font-weight:600;color:var(--ink)}
  .sit .ck{font-size:15px;font-weight:800;color:var(--brand);width:16px;text-align:right}
  .go{width:100%;padding:15px;border:none;border-radius:12px;margin-top:11px;
    background:var(--brand);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .skip{width:100%;padding:12px;border:none;background:none;color:var(--faint);
    font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* ── 결과 ─────────────────────────────────────────── */
  .lead{background:var(--tip-bg);border-radius:14px;padding:14px 16px;margin:16px 0 14px}
  .lead-t{font-size:13.5px;color:var(--text);line-height:1.5}
  .lead-t b{color:var(--brand)}
  .lead-n{display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-top:8px;font-size:15px;font-weight:800;color:var(--ink)}
  .lead-edit{font:inherit;font-size:12.5px;font-weight:700;color:var(--brand);
    background:#fff;border:none;border-radius:8px;padding:6px 11px;cursor:pointer}

  .row{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;
    display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
  .ph{width:96px;height:72px;border-radius:10px;background:#f4f5fa;overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:26px}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .nm{font-size:16px;font-weight:800;color:var(--ink);line-height:1.25}
  .ko{font-size:11.5px;color:var(--faint);margin-top:2px}
  .dist{font-size:12.5px;font-weight:700;color:var(--brand);margin-top:5px}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
  .t{font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:7px;
    background:var(--ok-bg);color:var(--ok-fg)}
  .t.hot{background:var(--hot-bg);color:var(--hot-fg)}
  .why{margin-top:8px;font-size:11.5px;font-weight:600;color:var(--ok-fg);
    background:var(--ok-bg);border-radius:7px;padding:6px 9px}
  .msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Near me</h1>
    <div class="tag">Explore Korea without the guesswork.</div>
  </header>
  <div id="app"><div class="msg">Loading…</div></div>
</div>

<script>
const SUPABASE_URL = "https://zygumrggzjwbkihlmpfy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5Z3Vtcmdnemp3YmtpaGxtcGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjY2OTIsImV4cCI6MjA5OTYwMjY5Mn0.9d8i1_W5y008VNtikdejIKA8jvnfay1TZRvdX13DkFE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BUSAN = { lat: 35.1379, lng: 129.0556 };

/* 상황 — 조건 이름이 아니라 사람이 하는 말로 적는다 */
const SITUATIONS = [
  { key:'solo',    ic:'👤', label:"I'm on my own",
    chip:'Eat alone',    test: p => p.solo_ok === true },
  { key:'card',    ic:'💳', label:'I only have a foreign card',
    chip:'Card OK',      test: p => p.foreign_card === true },
  { key:'menu',    ic:'🔤', label:"I can't read Korean",
    chip:'Foreign menu', test: p => p.english_menu === true },
  { key:'nospice', ic:'🌶️', label:"I can't do spicy",
    chip:'Not spicy',    test: p => !p.spice_level },
];

let PLACES = [];
let picked = new Set();
let asking = true;          // 상황을 묻는 중인가
let myPos  = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function distM(a, b){
  const R = 6371000, d = Math.PI/180;
  const x = Math.sin((b.lat-a.lat)*d/2)**2
    + Math.cos(a.lat*d)*Math.cos(b.lat*d)*Math.sin((b.lng-a.lng)*d/2)**2;
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}
const fmt = m => m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(1) + ' km';

/* ── 화면 ──────────────────────────────────────────── */

function viewAsk(){
  return `
    <div class="ask">
      <div class="ask-t">What is your situation right now?</div>
      <div class="ask-h">Pick what applies. We only show places where all of it is confirmed.</div>
      ${SITUATIONS.map(s => `
        <button class="sit ${picked.has(s.key) ? 'on' : ''}" data-sit="${s.key}">
          <span class="ic">${s.ic}</span>
          <span class="tx">${esc(s.label)}</span>
          <span class="ck">${picked.has(s.key) ? '✓' : ''}</span>
        </button>`).join('')}
      <button class="go" data-go="1">Show places</button>
      <button class="skip" data-skip="1">Skip — show everything</button>
    </div>`;
}

function viewList(){
  const sits = SITUATIONS.filter(s => picked.has(s.key));
  const origin = myPos || BUSAN;

  const list = PLACES
    .filter(p => sits.every(s => s.test(p)))
    .map(p => ({ ...p, _d: distM(origin, { lat:p.lat, lng:p.lng }) }))
    .sort((a, b) => a._d - b._d)
    .slice(0, 20);

  /* 무엇을 걸렀는지 문장으로 — 이 한 줄이 "목록"과 "판단"을 가른다 */
  const lead = picked.size ? `
    <div class="lead">
      <div class="lead-t">Places where
        <b>${sits.map(s => s.chip).join(' · ')}</b> is confirmed</div>
      <div class="lead-n">${list.length} places
        <button class="lead-edit" data-edit="1">Change</button></div>
    </div>` : '';

  if (!list.length){
    return lead + `<div class="msg">
      <b>Nothing matches all of that yet.</b><br>
      Try removing one condition.</div>`;
  }

  return lead + list.map((p, i) => {
    const tags = [];
    if (p.solo_ok === true)      tags.push(['', 'Eat alone']);
    if (p.foreign_card === true) tags.push(['', 'Card OK']);
    if (p.english_menu === true) tags.push(['', 'Foreign menu']);
    if (p.spice_level)           tags.push(['hot', p.spice_level.replace(/🌶️?/g,'').trim()]);

    return `<div class="row">
      <div class="ph">${p.image_url
        ? `<img src="${esc(p.image_url)}" alt="" loading="lazy">` : '🍜'}</div>
      <div>
        <div class="nm">${esc(p.name_en || p.name_ko)}</div>
        ${p.name_ko ? `<div class="ko">${esc(p.name_ko)}</div>` : ''}
        <div class="dist">🚶 ${Math.max(1, Math.round(p._d/67))} min · ${fmt(p._d)}</div>
        ${tags.length ? `<div class="tags">${tags.map(([c,l]) =>
          `<span class="t ${c}">${esc(l)}</span>`).join('')}</div>` : ''}
        ${i === 0 && picked.size
          ? `<div class="why">✓ Closest, and everything checks out.</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function render(){
  const app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = asking ? viewAsk() : viewList();
}

/* ── 이벤트 ────────────────────────────────────────── */
document.addEventListener('click', e => {
  const sit = e.target.closest('[data-sit]');
  if (sit){
    const k = sit.dataset.sit;
    picked.has(k) ? picked.delete(k) : picked.add(k);
    render();
    return;
  }
  if (e.target.closest('[data-go]')){   asking = false; render(); window.scrollTo(0,0); return; }
  if (e.target.closest('[data-skip]')){ asking = false; picked.clear(); render(); return; }
  if (e.target.closest('[data-edit]')){ asking = true;  render(); window.scrollTo(0,0); return; }
});

/* ── 시작 ──────────────────────────────────────────── */
async function start(){
  // 질문 화면은 데이터를 기다릴 필요가 없다. 먼저 보여준다.
  render();

  // 위치는 따로 요청한다
  navigator.geolocation?.getCurrentPosition(
    pos => { myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
             if (!asking) render(); },
    ()  => {},
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 }
  );

  try {
    const { data, error } = await sb.from('places')
      .select('id, name_en, name_ko, category, image_url, lat, lng, solo_ok, foreign_card, english_menu, spice_level')
      .not('lat','is',null).not('lng','is',null);
    if (error) throw error;
    PLACES = data || [];
    if (!asking) render();
  } catch(e){
    console.error(e);
    if (!asking) document.getElementById('app').innerHTML =
      `<div class="msg"><b>Couldn't load.</b><br>${esc(e.message)}</div>`;
  }
}

start();
</script>

</body>
</html>
